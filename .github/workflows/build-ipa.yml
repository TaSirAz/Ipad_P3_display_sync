name: Build isolated FP16 iPad IPA
on:
  workflow_dispatch:
  push:
    branches: [fp16-direct-test]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify FP16 storage
        run: |
          mkdir -p build
          cp tests/fp16.swift build/main.swift
          swiftc -O ipad/DisplayConfig.swift ipad/FrameStore.swift build/main.swift -o build/FP16Tests
          build/FP16Tests
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project iPadDisplayNative.xcodeproj -scheme iPadDisplayNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build/xcodebuild.log
      - name: Report build errors on failure
        if: failure()
        run: |
          echo "=== COMPILER ERRORS ==="
          grep -E "(error:|fatal error:)" build/xcodebuild.log -B 2 -A 3 || true
          echo "=== LAST 150 LINES OF LOG ==="
          tail -n 150 build/xcodebuild.log || true
      - name: Package
        run: |
          mkdir -p build/package/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/iPadDisplayNative.app build/package/Payload/
          cd build/package
          zip -qry ../iPadDisplayFP16-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iPadDisplayFP16-unsigned
          path: build/iPadDisplayFP16-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
